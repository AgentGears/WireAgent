name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (offline — no SDK dependency)
        # The Super-Browser SDK is a local path dependency and cannot resolve
        # on CI. The offline test suite runs against tests/stubs/super_browser
        # (activated automatically by tests/conftest.py when the real SDK is
        # absent; shape-parity enforced on dev machines by test_stub_parity).
        run: |
          pip install --no-deps -e .
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "pytest-cov>=5.0" "ruff>=0.6" "mypy>=1.11"
      - name: Tests
        run: python -m pytest -q
      - name: Lint (ruff)
        run: python -m ruff check src tests
      - name: Types (mypy)
        run: python -m mypy src/webwire

  windows-durability:
    name: windows durability (${{ matrix.python-version }})
    # L8-E1: the QUALIFIED environment, pinned by label (not windows-latest,
    # a moving label) AND verified at runtime by the native identity gate.
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ledger qualification dependencies
        run: |
          pip install --no-deps -e .
          pip install "pytest>=8.0" "pytest-asyncio>=0.23"
      - name: Platform fingerprint
        run: python -c "import os,platform,sys; print('os.name=',os.name); print('sys.platform=',sys.platform); print('platform=',platform.platform()); print('python=',sys.version)"
      - name: L8-E1 native identity gate (Windows Server 2025)
        # Fails the job on any other edition BEFORE qualification runs. The
        # gate's refusal behavior is qualified by its negative-control tests
        # (tests/test_m7_layer8_native_gate.py) which run in every suite.
        run: python tests/_l8_native_gate.py
      - name: L8-E2 expected-inventory verification (pre-run)
        run: python tests/_l8_inventory.py verify-collect
      - name: L8-E3 evidence record (complete reproducibility, L8-EF02)
        # One structured record: environment, FULL dependency inventory,
        # resolved revisions (merge + PR head + frozen baseline), runtime
        # identity, and qualification configuration incl. SDK mode.
        run: >-
          $r = @();
          $r += 'OS=' + (Get-CimInstance Win32_OperatingSystem).Caption + ' build=' + (Get-CimInstance Win32_OperatingSystem).BuildNumber;
          $r += 'merge_sha=' + $env:GITHUB_SHA;
          $r += 'pr_head=${{ github.event.pull_request.head.sha }}';
          $r += 'frozen_baseline=31d3688def12268d8f40654310f6760ef6bb9e6f';
          $r += 'frozen_matrix_sha=c4427263b4d110ef7a991d72370f14a91aec1190';
          $r += 'python=' + (python -c "import sys; print(sys.version.split()[0], end='')");
          $r += (fsutil fsinfo volumeinfo C:) -join ' | ';
          $r += 'runtime_build_id=' + (python -c "from webwire.authority_ipc_protocol import compute_runtime_build_id; print(compute_runtime_build_id(), end='')");
          $r += 'sdk_mode=' + (python -c "import importlib.util; print('real' if importlib.util.find_spec('super_browser') else 'offline-stub', end='')");
          $r >> l8-evidence.txt;
          pip freeze >> l8-evidence.txt;
          Get-Content l8-evidence.txt;
      - name: Upload L8 evidence record
        uses: actions/upload-artifact@v4
        with:
          name: l8-evidence-${{ matrix.python-version }}
          path: l8-evidence.txt
      - name: Windows safety-ledger qualification
        run: >-
          python -m pytest -q
          tests/test_effect_ledger.py
          tests/test_effect_ledger_schema.py
          tests/test_effect_ledger_durability_retry.py
          tests/test_m6_reconciliation_ledger.py
          tests/test_m6_reconciliation_ledger_durability.py
          tests/test_m6_reconciliation_path_identity.py
          tests/test_m6_recovery_projector.py
          tests/test_m6_layer5_restart.py
          tests/test_m6_layer6_windows_durability.py
          tests/test_m7_authority_owner_lock.py
          tests/test_m7_authority_owner_lock_setup_failures.py
          tests/test_m7_authority_owner_lock_callback_failures.py
          tests/test_m7_authority_owner_lock_failstop_processes.py
      - name: Windows named-pipe IPC qualification (F-64)
        # The Layer-4 transport's Windows half: real named pipes, the
        # current-user DACL, the accept loop's next-instance behavior,
        # and the shutdown/successor lifecycle. The AF_UNIX half runs in
        # the Linux full-suite job above.
        run: python -m pytest -q tests/test_m7_layer4_transport_windows.py tests/test_m7_layer4_ipc.py
      - name: Windows rule-store qualification (F-32)
        # The rule store's interprocess fence has a platform-specific lock
        # branch (msvcrt.locking here, flock on Linux); the full suite only
        # exercises the flock side in CI. Run the store suite — including
        # the two-process fence falsification — on Windows too.
        run: python -m pytest -q tests/test_user_rules.py
      - name: Symlink privilege probe (F90 diagnosis, L8-EF03)
        # Capture the ACTUAL os.symlink failure mode with its Windows error
        # code — registry state alone is not evidence the operation works.
        run: >-
          python -c "import os, tempfile, pathlib, traceback;
          d = tempfile.mkdtemp();
          t = pathlib.Path(d, 't.txt'); t.write_text('x');
          l = pathlib.Path(d, 'l.txt');
          l.symlink_to(t);
          print('SYMLINK PROBE: OK ->', l.resolve())"
      - name: Enable Windows Developer Mode (F90 symlink privilege, L8-EF01)
        # The F90 substituted-pathname test is a MANDATORY Windows-native
        # scenario; its symlink-creation skip is a native evidence gap, not
        # a platform boundary. Developer Mode grants symlink creation.
        run: reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
      - name: Windows L8 integrated Layer-7 harness qualification (E-2)
        # The frozen matrix's M-1..M-5 native evidence: the integrated
        # multi-process harness on the pinned qualified image. Structured
        # JUnit XML drives the inventory verifier (L8-EF01: console parsing
        # was vacuous on Windows); the job fails on any test failure,
        # missing/deselected scenario, or unexpected skip.
        run: >-
          python -m pytest -q -ra
          --junitxml=l7-run.xml
          tests/test_m7_layer7_ownership.py
          tests/test_m7_layer7_crash_matrix.py
          tests/test_m7_layer7_t16_race.py
          tests/test_m7_layer7_supported_faults.py
          tests/test_m7_layer7_ipc_faults.py
          tests/test_m7_layer7_media_boundary.py
          tests/test_m7_layer7_browser_child.py
          tests/test_m7_layer7_harness_safety.py
          tests/test_m7_layer6_ingress.py
          tests/test_m7_layer8_native_gate.py
          tests/test_m7_layer8_race_diagnostic.py;
          $rc = $LASTEXITCODE;
          python tests/_l8_inventory.py verify-run l7-run.xml;
          $inv = $LASTEXITCODE;
          if ($rc -ne 0) { Write-Host "PYTEST: FAILED ($rc)" } else { Write-Host "PYTEST: PASSED" };
          if ($inv -ne 0) { Write-Host "INVENTORY: FAILED ($inv)" } else { Write-Host "INVENTORY: OK" };
          if ($rc -ne 0 -or $inv -ne 0) { Write-Host "FINAL: FAILED"; exit 1 };
          Write-Host "FINAL: PASSED"
      - name: Upload L7 JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-run-${{ matrix.python-version }}
          path: l7-run.xml
