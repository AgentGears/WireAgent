[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webwire"
version = "0.2.0"
description = "Browser-native X/Twitter capability layer for AI agents — built on Super-Browser"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Agent-WebWire Contributors" }]
keywords = ["x", "twitter", "agent", "browser-automation", "super-browser"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    # Deliberately EMPTY: the Super-Browser SDK is a local path dependency
    # (editable install of the user's own SDK) and cannot resolve on CI or
    # other machines. Live/browser work installs it via the [browser] extra;
    # offline tests run against tests/stubs/super_browser when the SDK is
    # absent (enforced shape-parity locally by tests/test_stub_parity.py).
]

[project.optional-dependencies]
browser = [
    # Local path dependency — the user's own SDK. Editable install.
    "superbrowser-sdk @ file:///C:/Next-Era/Super-Browser",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webwire"]

[tool.hatch.metadata]
# Required because project.dependencies contains a direct file:/// reference
# to the local Super-Browser SDK.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/webwire"]
branch = true

[tool.ruff]
line-length = 112
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ASYNC"]
# BLE001 (blind except) is this codebase's documented idiom (envelope-everything);
# it is opted into per-site with noqa where intentional.

[tool.ruff.lint.per-file-ignores]
# Irreducible single-line units (embedded CDP JS expressions, long enum-member
# comment lines): wrapping them would obscure review, not help it.
"src/webwire/write_broker.py" = ["E501"]
"src/webwire/safety/models.py" = ["E501"]
"src/webwire/capabilities/*_image.py" = ["E501"]
"tests/test_broker.py" = ["E501"]
"tests/test_read_profile.py" = ["E501"]
"tests/test_write_kernel.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
# The SDK is untyped-external (or stub in CI).
[[tool.mypy.overrides]]
module = "super_browser.*"
ignore_missing_imports = true
follow_imports = "skip"

# Pillow is an OPTIONAL runtime dep (dimensions/EXIF niceties); not installed
# in CI — and its untyped-private-API surface differs per environment.
[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
